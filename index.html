const words=[['la casa','house'],['la mesa','table'],['la silla','chair'],['la puerta','door'],['la ventana','window'],['la cama','bed'],['el libro','book'],['el lápiz','pencil'],['el bolígrafo','pen'],['el cuaderno','notebook'],['la mochila','backpack'],['la escuela','school'],['el perro','dog'],['el gato','cat'],['el caballo','horse'],['el pájaro','bird'],['el pez','fish'],['la vaca','cow'],['la manzana','apple'],['el pan','bread'],['la leche','milk'],['el queso','cheese'],['el huevo','egg'],['la naranja','orange'],['la ciudad','city'],['la calle','street'],['el coche','car'],['el tren','train'],['la tienda','shop'],['el parque','park']];const ids=words.map((_,i)=>i);const blank=()=>({es:Array(30).fill(0),en:Array(30).fill(0)});let db={stars:[],master:blank(),learn:null,history:[],flashSessions:{},seen:[],attempted:{es:[],en:[]},direction:'es',scope:'all'};try{db={...db,...JSON.parse(localStorage.getItem('scc-study-v1')||'{}')}}catch(e){};let view='role',flash=null,test=null,filter='all',sort='original';const $=()=>document.getElementById('app');function save(){try{localStorage.setItem('scc-study-v1',JSON.stringify(db))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function btn(s,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${s}</button>`}function title(s,d=''){return `<h1>${s}</h1><p>${d}</p>`}function nav(){return `<nav>${btn('My subjects',"go('subjects')",'ghost')} / ${btn('Spanish',"go('subject')",'ghost')} / ${btn('Assessment 1',"go('folder')",'ghost')} / ${btn('Los sustantivos',"go('dashboard')",'ghost')}</nav>`}function go(v){view=v;render();window.scrollTo(0,0)}function pool(scope){return scope==='starred'?ids.filter(i=>db.stars.includes(i)):ids}function dirs(d){return d==='both'?['es','en']:[d]}function state(i,d){return Math.min(...dirs(d).map(k=>db.master[k][i]||0))}function star(i){return `<button class="star ${db.stars.includes(i)?'on':''}" aria-label="${db.stars.includes(i)?'Unstar':'Star'} ${esc(words[i][0])}" onclick="toggleStar(${i})">${db.stars.includes(i)?'★':'☆'}</button>`}function toggleStar(i){const field=document.getElementById('written'),draft=field?.value;db.stars=db.stars.includes(i)?db.stars.filter(x=>x!==i):[...db.stars,i];save();render();if(draft!==undefined&&document.getElementById('written'))document.getElementById('written').value=draft}function progress(scope=ids,d=db.direction,rounds=0,label='Overall learning progress'){const a=scope.map(i=>state(i,d)),m=a.filter(x=>x===2).length,f=a.filter(x=>x===1).length,r=a.length-m-f,n=a.length||1,p=Math.round(a.reduce((x,y)=>x+y,0)/(2*n)*100);return `<div class="card"><div class="line"><h2>${label}</h2><b style="font-size:25px">${p}%</b></div><div class="bar"><span class="master" style="width:${m/n*100}%"></span><span class="fam" style="width:${f/n*100}%"></span></div><div class="stats"><div><b>${m}</b><small>Mastered</small></div><div><b>${f}</b><small>Familiar</small></div><div><b>${r}</b><small>Remaining</small></div><div><b>${rounds}</b><small>Rounds completed</small></div></div><p>${m} / ${a.length} terms mastered · ${directionLabel(d)}</p></div>`}function directionLabel(d){return d==='es'?'English → Spanish':d==='en'?'Spanish → English':'Both directions'}function options(prefix){return `<label for="scope">Study terms</label><select id="scope" onchange="db.scope=this.value;save()"><option value="all" ${db.scope==='all'?'selected':''}>All 30 terms</option><option value="starred" ${db.scope==='starred'?'selected':''}>Starred only (${db.stars.length})</option></select><label for="direction">Answer with</label><select id="direction" onchange="db.direction=this.value;save()">${['es','en','both'].map(d=>`<option value="${d}" ${db.direction===d?'selected':''}>${directionLabel(d)}</option>`).join('')}</select>`}function status(i){return state(i,db.direction)===2?2:state(i,db.direction)>0||dirs(db.direction).some(d=>db.attempted[d].includes(i))?1:0}function vocabulary(list){list=[...list];if(sort==='status')list.sort((a,b)=>status(b)-status(a)||a-b);return `<div class="card">${list.length?list.map(i=>`<div class="vrow"><b>${words[i][0]}</b><span>${words[i][1]}</span><span class="badge ${['','f','m'][status(i)]}">${['Not studied','Needs learning','Mastered'][status(i)]}</span>${star(i)}</div>`).join(''):'<p>No starred terms yet. Star vocabulary from the full list.</p>'}</div>`}function modeTile(label,sub,action,primary=false){return `<button class="tile ${primary?'primary':''}" onclick="${action}">${label}<small>${sub}</small></button>`}function render(){document.getElementById('workspace-label').textContent=view.startsWith('staff')?staffRoles[staffRole]+' workspace':view==='role'?'School learning portal':'Student learning portal';if(view.startsWith('staff')||view==='studentcompare')return renderStaff();if(view.startsWith('math'))return renderMath();let html=view==='role'?'':view==='signin'||view==='subjects'?`<nav>${btn('Role selection',"go('role')",'ghost')}</nav>`:nav();if(view==='role'){html+=title('Are you a…?','Choose your school role to continue')+`<div class="grid two">${modeTile('Student','Study and practise',"go('signin')",true)}${modeTile('Teacher','Classes, assessment and lessons',"chooseStaff('teacher')")}${modeTile('Technician','Practical preparation and equipment',"chooseStaff('technician')")}${modeTile('Parent or carer','School information and learning updates',"chooseStaff('parent')")}${modeTile('Office staff','Information and school services',"chooseStaff('office')")}${modeTile('Administrator','School management and access',"chooseStaff('admin')")}${modeTile('Careers staff','Sixth-form courses and advice',"chooseStaff('careers')")}${modeTile('Exams officer','Examination notices and assessments',"chooseStaff('exams')")}</div>`}else if(view==='signin'){html+=title('Demo sign-in','Use the fictional student account. No school password is needed.')+`<div class="card">${btn('Continue as John McCallion',"go('subjects')")}<p>Year 11 · St Columb’s College demo student</p></div>`}else if(view==='subjects'){html+=title('Your subjects','Select a subject');html+=`<div class="grid">${modeTile('Spanish','Assessment 1',"go('subject')",true)}${modeTile('Maths','Unit M1 · Practice and marking',"mathGo('maths')")}</div><section class="map-section"><h2>School services</h2><div class="grid two">${modeTile('Sixth-form course comparison','Explore your subject options',"go('studentcompare')")}</div></section>`}else if(view==='subject'){html+=title('Spanish','Your assessment revision')+`<div class="card"><h2>Assessment 1</h2><p>1 vocabulary set · 30 terms</p>${btn('Learn assessment terms',"go('folder')")}</div>`}else if(view==='folder'){html+=title('Assessment 1','Spanish · Study materials')+progress()+`<div class="card"><h2>Los sustantivos — Everyday Nouns</h2><p>30 terms · Spanish / English</p>${btn('Open study set',"go('dashboard')")}</div>`}else if(view==='dashboard'){html+=title('Los sustantivos','Everyday Nouns · 30 terms · Assessment 1')+`<div class="grid">${modeTile('Flashcards',Object.values(db.flashSessions||{}).some(s=>!s.complete)?'Resume flashcard rounds':'Review vocabulary',"go('flashsettings')")}${modeTile('Learn',db.learn&&!db.learn.complete?'Resume learning':'Adaptive practice',"go('learnsettings')",true)}${modeTile('Test','Mock assessment',"go('testsettings')")}</div>`+progress(ids,db.direction,db.learn?.rounds||0) +`<div class="line"><h2>Terms in this set (${pool(filter).length})</h2><div class="opts"><select aria-label="Filter terms" onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>All terms (30)</option><option value="starred" ${filter==='starred'?'selected':''}>Starred (${db.stars.length})</option></select><select aria-label="Sort terms" onchange="sort=this.value;render()"><option value="original" ${sort==='original'?'selected':''}>Original order</option><option value="status" ${sort==='status'?'selected':''}>Learning status</option></select></div></div>`+vocabulary(pool(filter))+`<div class="card"><div class="line"><h2>Test history</h2><b>${db.history.length?Math.max(...db.history.map(x=>x.percent))+'% best':'No tests yet'}</b></div>${db.history.slice(-5).reverse().map(t=>`<p>${esc(t.date)} · ${t.correct}/${t.total} · ${t.percent}%</p>`).join('')}</div>`}else if(view==='vocabulary'){html+=title(filter==='starred'?'Starred vocabulary':'All vocabulary',filter==='starred'?`${db.stars.length} starred terms`:'30 Spanish nouns')+`<div class="opts">${btn('All terms',"filter='all';render()",'secondary')}${btn('Starred only',"filter='starred';render()",'secondary')}${btn('Study starred',"db.scope='starred';go('learnsettings')")}</div>`+vocabulary(pool(filter))}else if(view==='flashsettings'||view==='learnsettings'||view==='testsettings'){const m=view.replace('settings','');html+=title(m==='flash'?'Flashcards':m==='learn'?'Learn':'Practice test',m==='learn'?'Two correct answers per term, including written recall. No fixed number of rounds.':'Choose your study options.')+`<div class="card">${options()}${m==='test'?'<label for="count">Questions</label><select id="count"><option>10</option><option>20</option><option selected>30</option></select><label>Question types</label><label><input type="checkbox" name="qtype" value="written" checked> Written</label><label><input type="checkbox" name="qtype" value="mc" checked> Multiple choice</label><label><input type="checkbox" name="qtype" value="tf"> True / false</label><label><input type="checkbox" name="qtype" value="matching"> Matching</label>':''}<p>${m==='learn'?'Each round contains up to six distinct unmastered terms.':' '}</p>${btn(m==='flash'?'Continue flashcards':m==='learn'?'Start Learn':'Start test',m==='flash'?'startFlash()':m==='learn'?'startLearn()':'startTest()')}${m==='flash'?`<p>Your flashcard round, card position and known cards are saved. Changing language does not clear them. All terms and starred-only each retain their own session.</p>${btn('Restart flashcards','restartFlash()','ghost')}`:''}${m==='learn'&&db.learn&&!db.learn.complete?btn('Resume saved session',"go('learn')",'secondary'):''}${m==='learn'?btn('Reset selected mastery','resetLearn()','ghost'):''}</div>`}else if(view==='flash'){if(flash.complete){html+=title('Flashcards complete','All selected cards marked known')+`<div class="card center"><h2>${flash.round} rounds completed</h2><p>Learn mastery has not changed.</p>${btn('Start again','restartFlash()')}${btn('Return to study set',"go('dashboard')",'secondary')}</div>`}else if(flash.summary){html+=title(`Round ${flash.round} complete`,`${flash.known.length} known · ${flash.next.length} to review`)+`<div class="card">${btn('Continue to Round '+(flash.round+1),'nextFlashRound()')}${btn('Return to study set',"go('dashboard')",'secondary')}</div>`}else{let i=flash.list[flash.pos],d=flash.dirs[i],front=d==='es'?1:0;html+=title('Flashcards',`Round ${flash.round} · ${flash.pos+1} / ${flash.list.length} · ${directionLabel(flash.direction)}`)+`<div class="card"><div class="line"><span class="pill">${(flash.flip?1-front:front)===0?'Spanish':'English'}</span>${star(i)}</div><button class="ghost term" style="width:100%" onclick="flash.flip=!flash.flip;render()">${words[i][flash.flip?1-front:front]}</button><p class="center">Click the card to flip</p><div class="line">${btn('Previous','moveFlash(-1)','secondary')}${btn('Shuffle','shuffleFlash()','secondary')}${btn('Next','moveFlash(1)','secondary')}</div></div><div class="opts">${btn('Still learning','markFlash(false)','secondary')}${btn('Know it','markFlash(true)')}${btn('Study options',"go('flashsettings')",'ghost')}</div><p>${flash.known.length} / ${flash.total} marked known · Does not affect Learn mastery</p>`}}else if(view==='learn'){html+=learnHTML()}else if(view==='test'){html+=testHTML()}else if(view==='results'){html+=resultHTML()}if(view==='flash'&&flash){db.flashSessions[flash.scope]=flash;save()}$().innerHTML=html;const field=document.getElementById('written');if(field&&!field.disabled)field.focus()}
function startFlash(force=false){const scope=db.scope,a=pool(scope);db.flashSessions=db.flashSessions||{};const existing=db.flashSessions[scope];if(!force&&existing){flash=existing;if(flash.direction!==db.direction){flash.direction=db.direction;flash.dirs=Object.fromEntries(flash.list.map((i,j)=>[i,db.direction==='both'?(j%2?'en':'es'):db.direction]));flash.flip=false}save();return go('flash')}if(!a.length)return alert('Star some terms first.');flash={scope,list:[...a],pos:0,flip:false,known:[],ratings:{},round:1,total:a.length,summary:false,complete:false,direction:db.direction,dirs:Object.fromEntries(a.map((i,j)=>[i,db.direction==='both'?(j%2?'en':'es'):db.direction]))};db.flashSessions[scope]=flash;save();go('flash')}
function restartFlash(){if(db.flashSessions?.[db.scope]&&!confirm('Start a fresh flashcard session? Your Learn mastery, stars and test history will not change.'))return;startFlash(true)}
function finishFlashRound(){flash.next=flash.list.filter(i=>flash.ratings[i]!==true);flash.summary=flash.next.length>0;flash.complete=!flash.summary;render()}
function moveFlash(n){if(flash.complete||flash.summary)return;if(n>0&&flash.pos===flash.list.length-1)return finishFlashRound();flash.pos=Math.max(0,flash.pos+n);flash.flip=false;render()}
function shuffleFlash(){if(flash.summary||flash.complete)return;flash.list=shuffle(flash.list);flash.pos=0;flash.flip=false;render()}
function markFlash(known){let i=flash.list[flash.pos];flash.ratings[i]=known;flash.known=flash.known.filter(x=>x!==i);if(known)flash.known.push(i);moveFlash(1)}
function nextFlashRound(){flash.list=flash.next;flash.round++;flash.pos=0;flash.flip=false;flash.ratings={};flash.summary=false;render()}
function resetLearn(){if(!confirm('Reset mastery for selected terms and language direction? Stars and test history stay saved.'))return;for(let i of pool(db.scope))for(let d of dirs(db.direction))db.master[d][i]=0;for(let d of dirs(db.direction))db.attempted[d]=db.attempted[d].filter(i=>!pool(db.scope).includes(i));db.learn=null;save();render()}
function startLearn(){let list=pool(db.scope);if(!list.length)return alert('Star some terms first.');if(db.learn&&!db.learn.complete&&db.learn.direction===db.direction&&db.learn.scope===db.scope)return go('learn');db.learn={scope:db.scope,direction:db.direction,list,round:1,rounds:0,queue:[],pos:0,answers:[],feedback:null,summary:false,complete:false,last:[]};nextQueue();save();go('learn')}
function nextQueue(){let s=db.learn;let candidates=shuffle(s.list.filter(i=>state(i,s.direction)<2));if(!candidates.length){s.complete=true;s.summary=false;s.queue=[];return}let fresh=candidates.filter(i=>!s.last.includes(i)),old=candidates.filter(i=>s.last.includes(i));let selected=[...fresh,...old].slice(0,6);s.queue=selected.map(i=>{let pending=dirs(s.direction).filter(d=>db.master[d][i]<2);let d=shuffle(pending)[0];return makeQuestion(i,d,db.master[d][i]===0?'mc':'written')});s.pos=0;s.answers=[];s.feedback=null;s.summary=false;s.last=selected}
function makeQuestion(i,d,type){let target=d==='es'?0:1,correct=words[i][target];let options=shuffle([correct,...shuffle(ids.filter(x=>x!==i)).slice(0,3).map(x=>words[x][target])]);let proposition=type==='tf'?(Math.random()<.5?correct:options.find(x=>x!==correct)):null;return {i,d,type,prompt:words[i][1-target],correct,options,proposition}}

function startTest(){let p=pool(db.scope);if(!p.length)return alert('Star some terms first.');let count=Math.min(p.length,+document.getElementById('count').value),types=[...document.querySelectorAll('input[name=qtype]:checked')].map(e=>e.value);if(!types.length)return alert('Select at least one question type.');test={qs:shuffle(p).slice(0,count).map((i,j)=>makeQuestion(i,db.direction==='both'?(j%2?'en':'es'):db.direction,types[j%types.length])),answers:Array(count).fill(null),pos:0};go('test')}function testHTML(){let q=test.qs[test.pos];return title('Practice test',`Question ${test.pos+1} / ${test.qs.length} · Feedback after submission`)+`<div class="roundbar">${test.qs.map((_,i)=>`<span class="${test.answers[i]!==null?'done':''}"></span>`).join('')}</div>`+questionUI(q,'testAnswer',null,test.answers[test.pos]??'')+`<div class="line">${btn('Previous','moveTest(-1)','secondary')}${btn('Skip / Next','moveTest(1)','secondary')}${btn('Submit test','submitTest()')}</div>`}function testAnswer(a){test.answers[test.pos]=a;if(test.pos<test.qs.length-1)test.pos++;render()}function moveTest(n){let f=document.getElementById('written');if(f&&f.value.trim())test.answers[test.pos]=f.value;test.pos=Math.max(0,Math.min(test.qs.length-1,test.pos+n));render()}function submitTest(){let f=document.getElementById('written');if(f&&f.value.trim())test.answers[test.pos]=f.value;let missing=test.answers.filter(a=>a===null).length;if(missing&&!confirm(`Submit with ${missing} unanswered questions?`))return;test.results=test.qs.map((q,i)=>({...q,answer:test.answers[i]??'',ok:isCorrect(q,test.answers[i]??'')}));let correct=test.results.filter(r=>r.ok).length,total=test.qs.length;test.score={correct,total,percent:Math.round(correct/total*100)};db.history.push({...test.score,date:new Date().toLocaleDateString()});save();go('results')}function resultHTML(){let s=test.score;return title('Your test results','Practice assessment')+`<div class="card center"><div class="big">${s.percent}%</div><h2>${s.c const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

function mathQ(topic,hard){let k=rng(0,hard?2:1),a=rng(3,12),b=rng(2,9),c=rng(2,7),p=[10,15,20,25,30][rng(0,4)],q,ans,steps;
function make(question,answer,rubric,skill){return {topic,skill,question,answer:String(answer),rubric,marks:rubric.length};}

function mathStats(t){let rows=md.history.flatMap(h=>h.rows||[]).filter(r=>r.topic===t&&!r.review);let got=rows.reduce((s,r)=>s+r.awarded,0),max=rows.reduce((s,r)=>s+r.marks,0);return {got,max,p:max?Math.round(100*got/max):null};}
function mathTopicsFor(s){if(mathTopics.includes(s.topic))return [s.topic];if(s.topic==='My weakest topics'||s.difficulty==='Adaptive'){return [...mathTopics].sort((a,b)=>(mathStats(a).p??-1)-(mathStats(b).p??-1));}return shuffle(mathTopics);}

async function markMath(){if(mathBusy)return;if(!mathFiles.length||!mathUploadConsent){mathError='Add your pages and confirm the submission notice first.';return render()}if(!aiOnline){mathError='AI service not connected. Run the included server with an API key.';return render()}mathBusy=true;mathError='';render();try{let files=await Promise.all(mathFiles.map(async f=>({name:f.name,type:f.type,data:await dataURL(f.file)})));let r=await mathApi('mark',{sheet:md.sheet,files});mathResult=r;md.sheet.submitted=true;md.sheet.result=r;md.history=md.history.filter(h=>h.id!==md.sheet.id);md.history.push({id:md.sheet.id,date:new Date().toLocaleDateString(),rows:r.rows});mathSave();mathFiles.forEach(f=>URL.revokeObjectURL(f.url));mathFiles=[];mathBusy=false;go('mathresults')}catch(e){mathError=e.message;mathBusy=false;render()}}
function mathResults(){let r=mathResult;if(!r)return title('No results yet','Submit a worksheet to receive feedback.');let rows=r.rows,got=rows.filter(x=>!x.review).reduce((s,x)=>s+x.awarded,0),max=rows.filter(x=>!x.review).reduce((s,x)=>s+x.marks,0),review=rows.filter(x=>x.review).length;return title('Practice results','AI formative feedback · Not an official grade')+`<div class="card"><div class="big">${max?Math.round(100*got/max)+'%':'Pending'}</div><h2>${got} / ${max} assessed marks</h2><p>${review} question(s) require review and are excluded from the score.</p></div>${rows.map(x=>`<div class="card"><div class="line"><h2>Question ${x.number} · ${esc(x.topic)}</h2><b>${x.review?'Review needed':x.awarded+' / '+x.marks}</b></div><p><b>Read from your work:</b> ${esc(x.transcription)}</p>${x.criteria.map(c=>`<p>${c.awarded?'✓':'–'} ${esc(c.reason)}</p>`).join('')}<p>${esc(x.feedback)}</p><p><b>Correct answer:</b> ${esc(md.sheet.qs[x.number-1].answer)}</p></div>`).join('')}<div class="line">${btn('Generate targeted questions',"md.settings.topic='My weakest topics';mathGo('mathsettings')")}${btn('Return to M1',"mathGo('maths')",'secondary')}</div>`}
function mathDashboard(){return title('Unit M1','CCEA GCSE Mathematics · Foundation Tier · Calculator')+`<div class="line"><span class="pill">Mathematics workspace</span>${mathStatus()}</div><div class="grid two">${modeTile('AI Practice','Generate a worksheet',"mathGo('mathsettings')",true)}${modeTile('Scan & Mark','Upload handwritten working',"mathGo('mathupload')")}${modeTile('Past Papers','Four reference examination series',"mathGo('mathpapers')")}${modeTile('AI Tutor','Ask for help with a topic',"openMathTutor()")}</div>${md.sheet?`<div class="card"><h2>${md.sheet.submitted?'Latest worksheet':'Continue your worksheet'}</h2><p>${md.sheet.id} · ${md.sheet.qs.length} questions</p>${btn('View worksheet',"mathGo('mathworksheet')")} ${md.sheet.submitted&&md.sheet.result?btn('View results',"mathResult=md.sheet.result;mathGo('mathresults')",'secondary'):''}</div>`:''}<div class="card"><h2>Topic performance</h2><p>Based on assessed practice marks; unmarked work is not included.</p>${mathTopics.map(t=>{let a=mathStats(t);return `<div style="margin:16px 0"><div class="line"><b>${t}</b><span>${a.p===null?'Not assessed':a.p+'%'}</span></div><div class="bar"><span class="master" style="width:${a.p||0}%"></span></div></div>`}).join('')}</div><div class="card"><h2>Practice history</h2>${md.history.length?md.history.slice(-8).reverse().map(h=>{let a=h.rows.filter(r=>!r.review);return `<p>${esc(h.date)} · ${esc(h.id)} · ${a.reduce((s,r)=>s+r.awarded,0)}/${a.reduce((s,r)=>s+r.marks,0)} assessed marks · ${h.rows.length-a.length} to review</p>`}).join(''):'<p>No marked worksheets yet.</p>'}</div>`}
function mathPapers(){return title('M1 past papers','Reference corpus · CCEA GCSE Foundation Tier')+`<div class="card">${[['Summer 2024','30 · Irish-language paper'],['Summer 2025','28'],['November 2025','32'],['Summer 2026','33']].map(a=>`<div class="line mathquestion"><div><b>${a[0]}</b><p>${a[1]} numbered questions · 100 marks</p></div>${aiOnline||location.protocol!=='file:'?`<a href="/papers/${encodeURIComponent(a[0])}/paper" target="_blank">Paper</a><a href="/papers/${encodeURIComponent(a[0])}/scheme" target="_blank">Mark scheme</a>`:'<span class="badge">Server bundle</span>'}</div>`).join('')}<p>Source specification: Section 3.1, Number and algebra; Geometry and measures; Handling data. ${location.protocol!=='file:'?'<a href="/specification" target="_blank">View specification</a>':''}</p></div>`}
function openMathTutor(){if(md.sheet?.settings.mode==='mock'&&!md.sheet.submitted&&['mathworksheet','mathupload'].includes(view)){mathError='Tutor hints are disabled during the independent mock.';return render()}tutorOpen=!tutorOpen;render()}
function tutorPanel(){if(!tutorOpen)return '';return `<aside class="card tutor-panel"><div class="line"><h2>M1 Maths Tutor</h2>${btn('Close','tutorOpen=false;render()','ghost')}</div><p>${aiOnline?'Ask for a hint or an explanation.':'Live tutor requires the AI server.'}</p><div class="tutor-log">${tutorMessages.map(m=>`<div class="${m.role==='user'?'tutor-user':'tutor-ai'}">${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')}</div><form onsubmit="event.preventDefault();askMathTutor()"><label for="tutorQuestion">Your question</label><input id="tutorQuestion" type="text" placeholder="How do I calculate percentages?" maxlength="1500"><button style="margin-top:8px" ${mathBusy?'disabled':''}>${mathBusy?'Thinking…':'Send'}</button></form></aside>`}
async function askMathTutor(){let input=document.getElementById('tutorQuestion'),q=input.value.trim();if(!q||mathBusy)return;if(!aiOnline){mathError='AI service not connected.';return render()}if(md.sheet?.settings.mode==='mock'&&!md.sheet.submitted){mathError='Tutor is disabled while your independent mock is unfinished.';return render()}tutorMessages.push({role:'user',text:q});mathBusy=true;render();try{let r=await mathApi('tutor',{messages:tutorMessages.slice(-10),worksheet:md.sheet&&!md.sheet.submitted?md.sheet.qs.map(({question,topic})=>({question,topic})):[],performance:mathTopics.map(t=>({topic:t,...mathStats(t)}))});tutorMessages.push({role:'assistant',text:r.answer})}catch(e){tutorMessages.push({role:'assistant',text:'Unable to connect: '+e.message})}mathBusy=false;render()}
function renderMath(){let html=mathNav();if(view==='maths')html+=mathDashboard();else if(view==='mathsettings')html+=title('Generate practice questions','Create a batch of M1 questions to complete on paper')+mathSettings();else if(view==='mathworksheet')html+=mathWorksheet();else if(view==='mathupload')html+=mathUpload();else if(view==='mathresults')html+=mathResults();else if(view==='mathpapers')html+=mathPapers();if(mathError)html+=`<div class="feedback wrong" role="alert">${esc(mathError)}</div>`;let blocked=md.sheet?.settings.mode==='mock'&&!md.sheet.submitted;html+=`<div class="no-print"><button class="tutor-fab" onclick="openMathTutor()" ${blocked?'disabled':''}>${blocked?'Tutor paused':'✦ AI Maths Tutor'}</button>${blocked?'':tutorPanel()}</div>`;$().innerHTML=html;}
